settings:
  language: auto
  default_destination: obsidian
  # Dual-ASR correction pipeline
  enable_correction: true
  correction_version: v4  # v4 = conservative, v3 = aggressive
network:
  # 网络超时与重试（秒）。瞬断场景自动指数退避重试，永久错误（401/403/404）不重试
  http_timeout: 30        # 平台解析类 HTTP 请求
  download_timeout: 600   # yt-dlp / FFmpeg 下载转码子进程
  api_timeout: 20         # 第三方解析 API
  max_retries: 2          # 瞬断重试次数
  backoff_base: 1.0       # 指数退避基数（1s / 2s / 4s ...）
cache:
  max_age_days: 30        # 本地缓存过期天数，过期条目在读取时自动清理
siliconflow:
  api_key: YOUR_SILICONFLOW_KEY
  model: FunAudioLLM/SenseVoiceSmall
faster_whisper:
  model: small
  device: cpu
  compute_type: int8
  beam_size: 5
  vad_filter: true
platforms:
  youtube:
    prefer_subtitles: true  # 优先使用官方字幕
    subtitle_languages: [zh, en, ja, ko]
  bilibili:
    prefer_subtitles: true  # 优先使用 CC 字幕
    subtitle_languages: [zh-CN, zh, en]
  douyin:
    enable_cdp: true
    enable_third_party: false
    # api_base_url: http://localhost:80  # 可选：Evil0ctal/Douyin_TikTok_Download_API 自部署实例
  transcription:
    strategy: subtitle_first  # subtitle_first | siliconflow_only | faster_whisper_only | dual_asr
    fallback_provider: openai_whisper  # 兜底转录 provider
providers:
  default_provider: openai
  openai:
    api_key: YOUR_OPENAI_KEY
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    max_tokens: 4000
  # OpenAI-compatible provider（通用 LLM 接入点，如 MiniMax / DeepSeek / 豆包等）
  # 配置环境变量 LLM_API_KEY / LLM_BASE_URL / VIDKNOT_LLM_MODEL
  openai-compatible:
    api_key: ""
    base_url: ""
    model: gpt-4o
    max_tokens: 4000
  zhipuai:
    api_key: YOUR_ZHIPU_KEY
    base_url: https://open.bigmodel.cn/api/paas/v4/
    model: glm-4-flash
    max_tokens: 4000
  siliconflow:
    api_key: YOUR_SILICONFLOW_KEY
feishu:
  app_id: YOUR_FEISHU_APP_ID
  app_secret: YOUR_FEISHU_APP_SECRET
  default_folder: VidkNot
obsidian:
  vault_path: ./obsidian-vault
  default_folder: 视频笔记
notion:
  token: YOUR_NOTION_TOKEN
  page_id: YOUR_NOTION_PAGE_ID
