settings:
  language: auto
  default_destination: obsidian
  # Dual-ASR correction pipeline
  enable_correction: true
  correction_version: v4  # v4 = conservative, v3 = aggressive
  # 校正 / 搜证后端 —— 不绑定任何厂商
  #   correction_backend: auto | provider | mmx | none
  #     auto     = 按 provider -> mmx -> 跳过 的顺序自动选第一个可用的（默认）
  #     provider = 强制用 providers.default_provider 配的 OpenAI 兼容端点
  #     mmx      = 强制用 mmx CLI（MiniMax 官方 CLI）
  #     none     = 不做双 ASR 校正
  #   search_backend: mmx | none（mmx 未安装时自动跳过搜证，不报错）
  #   correction_model: 仅 mmx 后端生效；留空则用 mmx CLI 自身默认模型
  correction_backend: auto
  search_backend: mmx
  correction_model: MiniMax-M3
network:
  # 网络超时与重试（秒）。瞬断场景自动指数退避重试，永久错误（401/403/404）不重试
  http_timeout: 30        # 平台解析类 HTTP 请求
  download_timeout: 600   # yt-dlp / FFmpeg 下载转码子进程
  api_timeout: 20         # 第三方解析 API
  max_retries: 2          # 瞬断重试次数
  backoff_base: 1.0       # 指数退避基数（1s / 2s / 4s ...）
cache:
  max_age_days: 30        # 本地缓存过期天数，过期条目在读取时自动清理
siliconflow:
  api_key: YOUR_SILICONFLOW_KEY
  # 语音（ASR）模型。语音模型与文本模型是两回事，此处只管语音。
  # 若要单独覆盖，可启用下面的 siliconflow_asr 段（优先级更高）。
  model: FunAudioLLM/SenseVoiceSmall
# ASR 模型专属覆盖（可选；优先级高于上面的 siliconflow.model）
# siliconflow_asr:
#   model: FunAudioLLM/SenseVoiceSmall
faster_whisper:
  model: small
  device: cpu
  compute_type: int8
  beam_size: 5
  vad_filter: true
platforms:
  youtube:
    prefer_subtitles: true  # 优先使用官方字幕
    subtitle_languages: [zh, en, ja, ko]
  bilibili:
    prefer_subtitles: true  # 优先使用 CC 字幕
    subtitle_languages: [zh-CN, zh, en]
  douyin:
    enable_cdp: true
    enable_third_party: false
    # api_base_url: http://localhost:80  # 可选：Evil0ctal/Douyin_TikTok_Download_API 自部署实例
  transcription:
    strategy: subtitle_first  # subtitle_first | siliconflow_only | faster_whisper_only | dual_asr
    fallback_provider: openai_whisper  # 兜底转录 provider
providers:
  default_provider: openai-compatible
  openai:
    api_key: YOUR_OPENAI_KEY
    base_url: https://api.openai.com/v1
    model: gpt-4o-mini
    max_tokens: 4000
  # OpenAI-compatible provider（通用 LLM 接入点，如 MiniMax / DeepSeek / 豆包等）
  # 配置环境变量 LLM_API_KEY / LLM_BASE_URL / VIDKNOT_LLM_MODEL
  openai-compatible:
    api_key: ""
    base_url: ""
    model: gpt-4o
    max_tokens: 4000
  zhipuai:
    api_key: YOUR_ZHIPU_KEY
    base_url: https://open.bigmodel.cn/api/paas/v4/
    model: glm-4-flash
    max_tokens: 4000
  siliconflow:
    # 这里只复用凭证与端点；语音模型请用顶层 siliconflow.model
    # （providers.*.model 的语义是「文本 LLM 模型」，不是语音模型）
    api_key: YOUR_SILICONFLOW_KEY
    base_url: https://api.siliconflow.cn/v1
feishu:
  app_id: YOUR_FEISHU_APP_ID
  app_secret: YOUR_FEISHU_APP_SECRET
  default_folder: VidkNot
obsidian:
  vault_path: ./obsidian-vault
  default_folder: 视频笔记
notion:
  token: YOUR_NOTION_TOKEN
  page_id: YOUR_NOTION_PAGE_ID
yuque:
  token: YOUR_YUQUE_TOKEN
  login: YOUR_YUQUE_LOGIN
  default_path: VidkNot
