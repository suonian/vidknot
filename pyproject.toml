[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vidknot"
version = "0.6.4"
description = "VidkNot — Video Knowledge, Knotted. A general research platform framework for extracting knowledge from 11+ self-media platforms (YouTube, Bilibili, Douyin, Xiaohongshu, Kuaishou, TikTok, Twitter/X, Instagram, WeChat Channels, Weibo, Vimeo). Dual-ASR cross-validation, OpenAI-compatible LLM, pluggable storage backends (Obsidian / Feishu / Notion / Yuque / SQLite / custom), async periodic scheduler, batch runner, credential-leak-proof source loader. CLI / FastAPI / MCP / Python API."
readme = "README.md"
license = "MIT"
authors = [{name = "VidkNot Team"}]
keywords = ["video", "transcription", "AI", "notes", "knowledge-base", "notion", "obsidian", "feishu", "yuque", "markdown"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: English",
    "Natural Language :: Chinese (Simplified)",
]
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2026.3.17",
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    # YouTube 官方字幕提取（字幕优先策略）
    "youtube-transcript-api>=0.6.0",
    # Dual-ASR correction pipeline
    "faster-whisper>=1.0.0",
]

[project.optional-dependencies]
feishu = ["feishu-docx>=0.2.7"]
# 内置静态 FFmpeg（wheel 自带二进制，离线可用），无需系统安装
bundled-ffmpeg = ["imageio-ffmpeg>=0.5.1"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.2.0",
]
all = [
    "feishu-docx>=0.2.7",
    "imageio-ffmpeg>=0.5.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.2.0",
]

[project.scripts]
vidknot = "vidknot.__main__:main"

[project.urls]
Homepage = "https://github.com/suonian/vidknot"
Repository = "https://github.com/suonian/vidknot"
Issues = "https://github.com/suonian/vidknot/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vidknot = ["*.yaml", "*.yml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
